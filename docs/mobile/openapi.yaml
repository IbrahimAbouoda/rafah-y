                "$ref": "#/components/schemas/Error"
        "404":
          description: "غير موجود أو خارج نطاقك — NOT_FOUND"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "409":
          description: "تعارض مع تغيير آخر — CONFLICT"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "422":
          description: "مدخلات أو انتقال غير صالح، مع field_errors — INVALID"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "429":
          description: "حد المعدل، مع رأس Retry-After — RATE_LIMITED"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "2XX":
          description: "نجاح — { data, message_ar? }"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    nullable: true
                  message_ar:
                    type: string
                required:
                  - data
                  - message_ar
              example:
                data: null
                message_ar: "أُضيفت «لجنة اختبار»."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                  format: uuid
                  pattern: "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$"
                slug:
                  type: string
                  maxLength: 60
                  pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
                nameAr:
                  type: string
                  minLength: 3
                  maxLength: 100
                mandate:
                  type: string
                  maxLength: 2000
                isActive:
                  type: boolean
                sortOrder:
                  type: integer
                  minimum: 0
                  maximum: 1000
              required:
                - slug
                - nameAr
                - isActive
                - sortOrder
