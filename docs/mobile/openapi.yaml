# مولَّد — لا تعدّله باليد: npm run api:openapi (scripts/openapi.ts)
openapi: "3.0.3"
info:
  title: "Rafah Pulse — Mobile API"
  version: "1.0.0"
  description: "واجهة تطبيق الجوّال (Flutter) — العميل الثاني للخادم وقاعدة البيانات نفسيهما (D44).\nكل مسار يمرّ بقالب Server Action نفسه: الهوية ← الصلاحية ← Zod ← الدالة المشتركة في lib/** داخل معاملة مع سطر التدقيق.\nالهوية: Authorization: Bearer <رمز وصول Supabase>. الأخطاء: { error: { code, message_ar, field_errors? } } بالرسالة العربية نفسها التي يعرضها الويب.\nالأرقام المرجعية ورموز التتبّع يولّدها الخادم وحده. المبالغ نصوص عشرية. بيانات التواصل لا تُخزَّن على الجهاز.\nمسارات بلا مثال استجابة مسجَّل: 0"
servers:
  - url: "/api/mobile/v1"
security:
  - bearer: []
