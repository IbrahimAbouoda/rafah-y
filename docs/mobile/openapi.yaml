          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: "نجاح — { data, message_ar? }"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      committee:
                        type: object
                        properties:
                          id:
                            type: string
                          slug:
                            type: string
                          nameAr:
                            type: string
                          mandate:
                            nullable: true
                        required:
