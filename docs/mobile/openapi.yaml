          description: "حد المعدل، مع رأس Retry-After — RATE_LIMITED"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "2XX":
          description: "نجاح — { data, message_ar? }"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      reference:
                        type: string
                      status:
                        type: string
                      committee:
                        nullable: true
                      submittedAt:
                        type: string
                        format: date-time
                      events:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                            toStatus:
                              type: string
                            note:
                              type: string
                            at:
                              type: string
                              format: date-time
                          required:
                            - id
                            - toStatus
                            - note
                            - at
                    required:
                      - reference
                      - status
                      - committee
                      - submittedAt
                      - events
                  message_ar:
                    type: string
                required:
                  - data
                  - message_ar
              example:
                data:
                  reference: RF-CMP-2026-000001
                  status: SUBMITTED
                  committee: null
                  submittedAt: "2026-01-01T09:00:00.000Z"
                  events:
                    - id: "00000000-K7QM-3XWD-8000-000000000000"
                      toStatus: SUBMITTED
                      note: "استُلمت الشكوى وسُجّلت برقمها المرجعي."
                      at: "2026-01-01T09:00:00.000Z"
                message_ar: "وجدنا شكواك."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reference:
                  type: string
                  pattern: "^RF-CMP-\\d{4}-\\d{6}$"
                accessCode:
                  type: string
                  pattern: "^[A-Z0-9]{8}$"
              required:
                - reference
                - accessCode
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: "رمز وصول Supabase Auth"
  schemas:
    Success:
      type: object
      properties:
        data: {}
        message_ar:
          type: string
      required:
        - data
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message_ar
          properties:
            code:
              type: string
              enum:
                - UNAUTHENTICATED
                - FORBIDDEN
                - NOT_FOUND
                - CONFLICT
                - INVALID
                - RATE_LIMITED
                - SERVER
            message_ar:
              type: string
            field_errors:
              type: object
              additionalProperties:
                type: array
                items:
                  type: string
