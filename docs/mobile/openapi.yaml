                            - id
                            - action
                            - entityType
                            - entityId
                            - actorRoles
                            - before
                            - after
                            - createdAt
                            - actor
                      total:
                        type: integer
                      filtered:
                        type: boolean
                      page:
                        type: integer
                      pageSize:
                        type: integer
